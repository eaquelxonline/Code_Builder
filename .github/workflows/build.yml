name: Build and verify

on:
  push:
    branches:
      - Apk_Builder_Beta
      - "claude/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CODE_BUILDER_RUST_VERSION: "1.97.1"
  CODE_BUILDER_JDK_VERSION: "25"
  CODE_BUILDER_NDK_VERSION: "29.0.14206865"
  CODE_BUILDER_BUILD_TOOLS_VERSION: "36.0.0"
  CODE_BUILDER_ANDROID_API: "36"
  CODE_BUILDER_CMAKE_VERSION: "4.4.2"
  CODE_BUILDER_CMAKE_SHA256: "3ada9a3f5d8a85413579bdd0ea6aa8e8da86efdd6d15c91a1afa517f2021956c"
  CODE_BUILDER_SDK_CMAKE_FOR_NINJA: "4.1.2"

jobs:
  artifacts:
    name: Old artifacts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete what earlier runs left behind
        uses: actions/github-script@v8
        with:
          script: |
            const listed = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const newest = listed
              .filter((one) => !one.expired)
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];
            let removed = 0;
            for (const one of listed) {
              if (newest && one.id === newest.id) {
                continue;
              }
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: one.id,
              });
              removed += 1;
            }
            core.info(`Removed ${removed} of ${listed.length} artifacts.`);

  core:
    name: Core
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/New/
            !/Compilers/Kotlin/*.txt

      - name: Install the pinned JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.CODE_BUILDER_JDK_VERSION }}

      - name: Install the pinned build tools
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --licenses > /dev/null <<< "$(printf 'y\n%.0s' $(seq 1 100))"
          "$sdkmanager" "build-tools;$CODE_BUILDER_BUILD_TOOLS_VERSION"
          test -x "$ANDROID_HOME/build-tools/$CODE_BUILDER_BUILD_TOOLS_VERSION/apksigner"

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$CODE_BUILDER_RUST_VERSION" \
            --profile minimal --component rustfmt --component clippy
          rustup default "$CODE_BUILDER_RUST_VERSION"
          rustc --version
          test "$(rustc --version | cut -d' ' -f2)" = "$CODE_BUILDER_RUST_VERSION"

      - name: Run every check that needs no Android build
        run: ./Test/Builder_Test.py --strict layout comments templates speech independence format lint dependencies strings core

      - name: Install the LLVM tools the oracle comparisons run
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm
          llvm-tblgen --version

      - name: Hold every reference suite, oracle comparison and determinism check
        run: ./Test/Builder_Test.py --strict suites differential determinism assembler c-front-end

  apk:
    name: Builder APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/New/
            !/Compilers/Kotlin/*.txt

      - name: Install the pinned JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.CODE_BUILDER_JDK_VERSION }}
          # The Gradle distribution, the Android Gradle Plugin and the Kotlin
          # compiler are the same bytes every run. Fetching them again each
          # time is the longest thing this job does before it builds anything.
          cache: gradle

      - name: Install the pinned Rust toolchain and Android targets
        run: |
          set -euo pipefail
          rustup toolchain install "$CODE_BUILDER_RUST_VERSION" --profile minimal
          rustup default "$CODE_BUILDER_RUST_VERSION"
          rustup target add aarch64-linux-android x86_64-linux-android
          rustc --version

      - name: Install the pinned Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$sdkmanager" --licenses > /dev/null <<< "$(printf 'y\n%.0s' $(seq 1 100))"

          "$sdkmanager" \
            "platforms;android-$CODE_BUILDER_ANDROID_API" \
            "build-tools;$CODE_BUILDER_BUILD_TOOLS_VERSION" \
            "ndk;$CODE_BUILDER_NDK_VERSION" \
            "cmake;$CODE_BUILDER_SDK_CMAKE_FOR_NINJA"

          test -d "$ANDROID_HOME/ndk/$CODE_BUILDER_NDK_VERSION"

      - name: Provision the pinned CMake from upstream
        run: |
          set -euo pipefail
          archive="cmake-$CODE_BUILDER_CMAKE_VERSION-linux-x86_64.tar.gz"
          url="https://github.com/Kitware/CMake/releases/download/v$CODE_BUILDER_CMAKE_VERSION/$archive"

          curl --fail --silent --show-error --location --output "$archive" "$url"
          echo "$CODE_BUILDER_CMAKE_SHA256  $archive" | sha256sum --check --strict

          install --directory "$HOME/cmake-$CODE_BUILDER_CMAKE_VERSION"
          tar --extract --gzip --file "$archive" \
            --directory "$HOME/cmake-$CODE_BUILDER_CMAKE_VERSION" --strip-components=1

          cp "$ANDROID_HOME/cmake/$CODE_BUILDER_SDK_CMAKE_FOR_NINJA/bin/ninja" \
             "$HOME/cmake-$CODE_BUILDER_CMAKE_VERSION/bin/ninja"

          reported=$("$HOME/cmake-$CODE_BUILDER_CMAKE_VERSION/bin/cmake" --version | head -1)
          echo "$reported"
          test "$reported" = "cmake version $CODE_BUILDER_CMAKE_VERSION"

      - name: Point the build at the provisioned toolchains
        env:
          CODE_BUILDER_SIGNING_CERT_SHA256: ${{ secrets.CODE_BUILDER_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "cmake.dir=$HOME/cmake-$CODE_BUILDER_CMAKE_VERSION"
          } > local.properties
          cat local.properties

      - name: Provision the release signing key
        env:
          CODE_BUILDER_KEYSTORE_BASE64: ${{ secrets.CODE_BUILDER_KEYSTORE_BASE64 }}
          CODE_BUILDER_KEYSTORE_PASSWORD: ${{ secrets.CODE_BUILDER_KEYSTORE_PASSWORD }}
          CODE_BUILDER_KEY_ALIAS: ${{ secrets.CODE_BUILDER_KEY_ALIAS }}
          CODE_BUILDER_KEY_PASSWORD: ${{ secrets.CODE_BUILDER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CODE_BUILDER_KEYSTORE_BASE64:-}" ]; then
            echo "No signing secrets are configured."
            echo "The release APK will be built unsigned and cannot be installed."
            echo "Add CODE_BUILDER_KEYSTORE_BASE64, CODE_BUILDER_KEYSTORE_PASSWORD, CODE_BUILDER_KEY_ALIAS"
            echo "and CODE_BUILDER_KEY_PASSWORD as repository secrets to change that."
            exit 0
          fi

          store="$RUNNER_TEMP/builder-release.jks"

          printf '%s' "$CODE_BUILDER_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | sed 's/^=*//' \
            | base64 --decode > "$store"
          test -s "$store"

          if ! keytool -list -keystore "$store" \
                -storepass "$CODE_BUILDER_KEYSTORE_PASSWORD" \
                -alias "$CODE_BUILDER_KEY_ALIAS" > /dev/null 2>&1; then
            decoded=$(wc -c < "$store")
            echo "CODE_BUILDER_KEYSTORE_BASE64 did not decode into a usable keystore."
            echo
            echo "It decoded to $decoded bytes, which narrows it down:"
            echo
            echo "  Right size, still refused -> a character in the secret was"
            echo "  altered in transit. One is enough, and the result decodes to"
            echo "  the correct length, so size proves nothing. Re-copy the whole"
            echo "  value from the file it was delivered in rather than hunting"
            echo "  for the character."
            echo
            echo "  Wrong size -> the copy was partial, or it picked up text"
            echo "  around the value. A partial copy decodes without complaint."
            echo
            echo "  Either way, also confirm CODE_BUILDER_KEYSTORE_PASSWORD and"
            echo "  CODE_BUILDER_KEY_ALIAS belong to this key."
            exit 1
          fi

          keytool -list -keystore "$store" \
            -storepass "$CODE_BUILDER_KEYSTORE_PASSWORD" \
            -alias "$CODE_BUILDER_KEY_ALIAS" 2>/dev/null | grep -i "fingerprint" || true

          {
            echo "CODE_BUILDER_SIGNING_STORE_FILE=$store"
            echo "CODE_BUILDER_SIGNING_STORE_PASSWORD=$CODE_BUILDER_KEYSTORE_PASSWORD"
            echo "CODE_BUILDER_SIGNING_KEY_ALIAS=$CODE_BUILDER_KEY_ALIAS"
            echo "CODE_BUILDER_SIGNING_KEY_PASSWORD=$CODE_BUILDER_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Release signing is configured."

      # Assembling depends on all three anyway. Running them first, in one
      # invocation rather than three, fails on a toolchain that drifted before
      # anything is compiled and pays Gradle's start-up once.
      - name: Verify the toolchains against the lock
        run: |
          ./gradlew --console=plain \
            verifyToolchainLock \
            :Builder:verifyCmakeToolchain \
            :Builder:verifyKotlinToolchain

      # rustfmt and clippy belong to the Core job, which installs them and has
      # nothing else to wait for. What is left here is what needs the Android
      # build: the package and the bundle first, then the Core suite reading
      # the real package this job just produced.
      - name: Run every check that needs the Android build
        run: ./Test/Builder_Test.py --strict release core bridge installable reproducible

      - name: Report what the release artifacts are
        run: |
          set -euo pipefail
          apk=$(ls Builder/build/outputs/apk/release/*.apk)
          aab=$(ls Builder/build/outputs/bundle/release/*.aab)
          echo "Release artifacts: $(basename "$apk") and $(basename "$aab")"
          echo "SHA-256: $(sha256sum "$apk" | cut -d' ' -f1)"
          echo "SHA-256: $(sha256sum "$aab" | cut -d' ' -f1)"
          "$ANDROID_HOME/build-tools/$CODE_BUILDER_BUILD_TOOLS_VERSION/apksigner" verify \
            --print-certs "$apk" || {
              echo
              echo "This artifact is NOT signed and cannot be installed."
              echo "Add the CODE_BUILDER_KEYSTORE_* repository secrets to get a signed one."
            }

      - name: Publish the package and the bundle
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: code-builder-release
          path: |
            Builder/build/outputs/apk/release/*.apk
            Builder/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

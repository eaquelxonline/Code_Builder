name: Drive Backup

on:
  push:
    branches: [ Apk_Builder_Beta ]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drive-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Drive backup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_HOOK: ${{ secrets.DRIVE_HOOK_URL != '' }}
      BACKUP_BRANCH: Apk_Builder_Beta
    steps:
      - name: Back the branch up to Drive
        env:
          DRIVE_HOOK_URL: ${{ secrets.DRIVE_HOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$HAS_HOOK" != "true" ]; then
            echo "DRIVE_HOOK_URL sırrı tanımlı değil; yedek atlandı." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          api="${GITHUB_API_URL:-https://api.github.com}/repos/$GITHUB_REPOSITORY"
          hook() {
            curl -fsSL --max-time 300 "$DRIVE_HOOK_URL&$1" || true
          }
          finish() {
            echo "Drive yedeği: ${1:0:500}" >> "$GITHUB_STEP_SUMMARY"
            echo "${1:0:500}"
          }
          sha=$(curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.sha" \
            "$api/commits/$BACKUP_BRANCH")
          case "$sha" in
            *[!0-9a-f]*|"") echo "::error::$BACKUP_BRANCH dalının son commit'i okunamadı"; exit 1 ;;
          esac
          reply=$(hook "islem=durum&sha=$sha")
          case "$reply" in
            "OK güncel"*) finish "$reply"; exit 0 ;;
            "OK eksik"*) echo "${reply:0:300}" ;;
            *) echo "::error::Drive yedeği başarısız: ${reply:0:300}"; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/yedek.zip"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 1200 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o "$archive" "$api/zipball/$sha"
          unzip -tq "$archive" > /dev/null
          size=$(stat -c %s "$archive")
          echo "arşiv: $size bayt"
          for attempt in 1 2 3; do
            reply=$(hook "islem=baslat&sha=$sha&boyut=$size")
            case "$reply" in
              "OK YUKLE https://"*)
                session="${reply#OK YUKLE }"
                echo "::add-mask::$session"
                if curl -fsS --max-time 1500 -X PUT -H "Content-Type: application/zip" \
                  --upload-file "$archive" -o /dev/null "$session"; then
                  reply=$(hook "islem=bitir&sha=$sha&boyut=$size")
                  case "$reply" in
                    "OK yüklendi"*) finish "$reply"; exit 0 ;;
                  esac
                  echo "deneme $attempt: ${reply:0:300}"
                else
                  echo "deneme $attempt: yükleme yarıda kaldı"
                fi
                ;;
              *) echo "deneme $attempt: ${reply:0:300}" ;;
            esac
            sleep 30
          done
          echo "::error::Drive yedeği başarısız: üç deneme de tutmadı"
          exit 1
